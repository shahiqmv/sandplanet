# Production stack (M8) — DigitalOcean droplet: Postgres + app (gunicorn) +
# Caddy (auto-HTTPS). Uploaded files go to DigitalOcean Spaces (S3), so no
# MinIO here. Reads secrets from .env (see .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db           # in-network hostname, overrides .env
      RUN_SEED: ${RUN_SEED:-0}    # first deploy: RUN_SEED=1 docker compose …
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                    # reachable by caddy only, not the host

  # Camera relay. Site boxes publish to 8554; browsers get WebRTC through Caddy
  # at /cams/*, so 8889 is deliberately NOT published to the host. Runs in the
  # app network so its auth hook reaches Django as web:8000 and never traverses
  # the public internet.
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    environment:
      # Django authorises every publish and every read. The secret proves the
      # caller is this relay; Django refuses if CAMERA_RELAY_SECRET is unset.
      MTX_AUTHHTTPADDRESS: http://web:8000/api/relay/auth/${CAMERA_RELAY_SECRET}
      # ICE must advertise the PUBLIC host, or a browser off-droplet is handed
      # an unreachable container address and the connection silently fails.
      MTX_WEBRTCADDITIONALHOSTS: ${CAMERA_PUBLIC_HOST:-}
    ports:
      - "8554:8554"               # RTSP publish — site boxes
      - "8189:8189/udp"           # WebRTC ICE media
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      - web
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # The client portal's own domain. Defaults to an internal name (harmless
      # self-signed cert, never used) so the staff site still starts if it's
      # unset; set PORTAL_DOMAIN in .env to serve the portal publicly.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-client.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - mediamtx

volumes:
  pgdata:
  caddy_data:
  caddy_config:
